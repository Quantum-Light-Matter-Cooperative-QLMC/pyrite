[project]
name = "pyrite-xray"
version = "0.3.0"
description = "Coherent X-ray radiation and electron transport in crystals."
readme = "README.md"
license = { file = "LICENSE.txt" }
license-files = ["LICENSE.txt", "THIRD-PARTY-NOTICES.md"]
classifiers = [
    "License :: Other/Proprietary License",
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.1",
    "crystals>=1.7,<2",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "platformdirs>=4.9",
    "scipy>=1.17.1",
    "tabulate>=0.10.0",
    "tomlkit>=0.13",
    "xraydb>=4.5.8",
    "psutil>=7.2.2",
    "numba>=0.66.0",
    "tqdm>=4.68.2",
    "h5py>=3.16.0",
    "endf-parserpy>=0.17.0",
]

[project.optional-dependencies]
external-db = [
    "mp-api>=0.46",
]
nvidia = [
    "cupy-cuda13x[ctk]>=14.1.1",
]
# AMD's current ``amd-cupy`` wheels are CPython 3.10-only. PyRITE requires
# Python 3.13+, so this extra builds upstream CuPy against ROCm instead. It must
# not be installed beside the CUDA CuPy distribution in one environment.
amd = [
    "cupy>=13.4.0",
]
intel = [
    "dpctl>=0.22.1",
    "dpnp>=0.20.0",
]

[project.scripts]
pyrite = "pyrite.cli:main"
pyrite-dev = "pyrite._dev:main"

[project.urls]
Homepage = "https://github.com/Quantum-Light-Matter-Cooperative-QLMC/pyrite#readme"
Repository = "https://github.com/Quantum-Light-Matter-Cooperative-QLMC/pyrite"
Documentation = "https://quantum-light-matter-cooperative-qlmc.github.io/pyrite/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrite"]

[dependency-groups]
test = [
    "pytest>=9.1.0",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=7.1.0",
]

lint = [
    "grimp>=3.12",
    "import-linter>=2.9",
    "ruff>=0.15.19",
    "ty>=0.0.63",
    "pre-commit>=4.6.0",
    "nbqa>=1.9.1",
    "nbstripout>=0.9.1",
]

docs = [
    "sphinx>=8.2",
    "myst-parser[linkify]>=4.0",
    "sphinx-autobuild>=2025.8.25",
    "pydata-sphinx-theme>=0.20.0",
    "sphinxcontrib-bibtex>=2.6",
]

# Independent crystallography oracle. Validation-only; never imported by the
# production package unless an explicit oracle check is requested.
oracle = [
    "Dans-Diffraction==3.4.0",
    "mp-api>=0.46.4",
]


dev = [
    { include-group = "test" },
    { include-group = "lint" },
]
notebooks = [
    "altair>=6.2.2",
    "anywidget>=0.11.0",
    "datashader>=0.19.1",
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
    "kaleido>=1.3.0",
    "marimo[recommended]>=0.23.16",
    "matplotlib>=3.11.0",
    "nbconvert>=7.17.1",
    "pandoc>=2.4",
    "plotly>=6.8.0",
    "vegafusion>=2.0.3",
    "vl-convert-python>=1.9.0.post1",
]

[tool.pytest.ini_options]
# Put src/ on the path so `import pyrite` resolves without requiring an install
# (an editable install via `uv sync` also works). Tests stay CPU-only/fast -- the
# heavy MC physics validation lives in checks/, not here.
testpaths = ["tests"]
addopts = [
    "-q",
    "--import-mode=importlib"
]
markers = [
    "online: test fetches from an external structure database (COD/MP); skipped unless PYRITE_ONLINE_TESTS=1",
    "oracle: test requires the pinned optional independent-validation backend",
    "hardware: requires specific physical hardware or device drivers",
    "intel_sycl: requires a working Intel SYCL dpnp/dpctl backend",
    "extern_codes: compiles and runs the external Fortran codes (ELSEPA, SBETHE, BremsLib); CI cannot run Fortran, so skipped unless PYRITE_EXTERN_CODES_TESTS=1 and a code tree and compiler are present",
]

[tool.coverage.run]
branch = true
source = ["src/pyrite"]
parallel = true
# pytest-xdist workers each write their own data file; `coverage combine` (run
# implicitly by pytest-cov) merges them.

[tool.coverage.paths]
# Map an installed/wheel copy back onto the checkout so combined runs from
# different environments do not report the same module twice.
source = ["src/pyrite", "*/site-packages/pyrite"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
# No `omit` for the compiled paths; read totals with the environment in mind
# instead of hiding modules.
#   - the CUDA kernel modules (`montecarlo/transport/_jit_*.py` and
#     `montecarlo/spectrum/*_jit_kernel.py`) import `cupy` at module scope, so
#     a CPU-only environment reports them 0% (never imported) and the total drops
#     ~7 points. With the `nvidia` extra installed their host-side code is
#     measured; `cupyx.jit` device bodies stay untraceable regardless.
#   - `@njit` bodies (`montecarlo/transport.py`, `geometry.py`, `groove.py`)
#     run compiled and bypass the Python tracer. Run coverage with
#     `NUMBA_DISABLE_JIT=1` to measure them (~2x wall clock; transport.py
#     37% -> 87%).

[tool.marimo.display]
theme = "light"

[tool.marimo.runtime]
watcher_on_save = "autorun"

[tool.jupytext]
formats = "ipynb,md:myst"

[tool.ty.src]
include = ["src"]

[[tool.ty.overrides]]
include = [
    "src/pyrite/montecarlo/transport/_jit_device.py",
    "src/pyrite/montecarlo/transport/_jit_kernel.py",
    "src/pyrite/montecarlo/transport/_jit_launch.py",
    "src/pyrite/montecarlo/transport/_jit_lut_kernel.py",
    "src/pyrite/montecarlo/transport/_jit_shell_device.py",
    "src/pyrite/montecarlo/runner/__init__.py",
    "src/pyrite/montecarlo/spectrum/*_jit_kernel.py",
]

[tool.ty.analysis]
allowed-unresolved-imports = ["cupy*", "cupy*.*"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

[[tool.ty.overrides]]
include = [
    "src/pyrite/apps/**/*.py",
    "src/pyrite/validation/anchor_figures.py",
    "src/pyrite/validation/feranchuk_spence.py",
]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
invalid-return-type = "ignore"
no-matching-overload = "ignore"

[tool.importlinter]
root_packages = ["pyrite"]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
id = "physics-core-stays-below-drivers"
name = "Physics core stays below driver and rendering packages"
type = "forbidden"
source_modules = [
    "pyrite.detectors",
    "pyrite.materials",
    "pyrite.montecarlo",
]
forbidden_modules = [
    "pyrite.apps",
    "pyrite.campaign",
    "pyrite.checkpoints",
    "pyrite.cli",
    "pyrite.perf",
    "pyrite.plots",
    "pyrite.remote",
    "pyrite.results",
    "pyrite.runs",
    "pyrite.validation",
    "pyrite.xsgen",
]
# The Monte Carlo runner is the case driver within this package. Its
# `case_tables` module resolves identity-matched, stored SBETHE tables before
# entering the transport core. The opt-in shell soft/hard mode's host-side
# table builders (`shell_rates` catalog helpers, `shell_transport` node check)
# resolve the same stored catalog tables; no Numba/CUDA kernel imports them.
# Numerical kernels and materials must not import the table-generation layer.
ignore_imports = [
    "pyrite.montecarlo.runner.case_tables -> pyrite.xsgen.sbethe",
    "pyrite.montecarlo.transport.shell_rates -> pyrite.xsgen.sbethe.catalog",
    "pyrite.montecarlo.transport.shell_transport -> pyrite.xsgen.sbethe.catalog",
]
allow_indirect_imports = true

# `materials` is the bottom of the physics core: it must not reach sideways into
# its own consumers either. Without this the three edges out of `catalog.py` and
# `attenuation.py` put `materials` inside the repository's one big import cycle
# and no contract noticed, because these three packages are absent from the
# forbidden list above -- they are peers of `materials`, not drivers.
[[tool.importlinter.contracts]]
id = "materials-imports-no-peer-domain"
name = "Materials imports no peer domain package"
type = "forbidden"
source_modules = [
    "pyrite.materials",
]
forbidden_modules = [
    "pyrite.detectors",
    "pyrite.energy_grid",
    "pyrite.instrument",
    "pyrite.montecarlo",
    "pyrite.xsgen",
]
allow_indirect_imports = true

# Detector-response operators are owned by ``detectors``. The Monte Carlo
# facade preserves their historical exports lazily, so no static transport code
# may regain a direct dependency on the detector package.
[[tool.importlinter.contracts]]
id = "montecarlo-imports-no-detectors"
name = "Monte Carlo imports no detector package"
type = "forbidden"
source_modules = [
    "pyrite.montecarlo",
]
forbidden_modules = [
    "pyrite.detectors",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "material-leaves-stay-independent"
name = "Material leaves do not import higher material modules"
type = "forbidden"
source_modules = [
    "pyrite.materials._cif",
    "pyrite.materials._transport_data",
    "pyrite.materials.atomic",
]
forbidden_modules = [
    "pyrite.materials.attenuation",
    "pyrite.materials.catalog",
    "pyrite.materials.crystal",
]
allow_indirect_imports = true

# The marimo apps sit at the very top of the stack, so nothing may import them.
# The launchers used to live beside the notebook helpers in `apps/`, which put a
# `cli -> apps` edge under every path back into `apps` and held the package
# inside the driver import cycle. The shared state those launchers still need
# lives below both (`pyrite._acp`, `pyrite._app_defaults`); this contract keeps
# it that way.
[[tool.importlinter.contracts]]
id = "nothing-imports-the-marimo-apps"
name = "No package imports the marimo app package"
type = "forbidden"
source_modules = [
    "pyrite.checkpoints",
    "pyrite.cli",
    "pyrite.remote",
    "pyrite.runs",
    "pyrite.validation",
]
forbidden_modules = [
    "pyrite.apps",
]
allow_indirect_imports = true

# `cli` drives; `checkpoints`, `runs` and `remote` report progress and emit
# automation payloads while they work. All three used to reach up into
# `cli._core`, `cli.json`, `cli._completion` and `cli.dashboard` for that, which
# is what put `cli` in a bidirectional pair with each of them. The shared
# primitives now live in `pyrite.console`, below everyone; this contract stops a
# domain package reaching up again.
[[tool.importlinter.contracts]]
id = "domain-packages-stay-below-cli"
name = "Domain packages do not import the CLI"
type = "forbidden"
source_modules = [
    "pyrite.checkpoints",
    "pyrite.console",
    "pyrite.energy_grid",
    "pyrite.paths",
    "pyrite.remote",
    "pyrite.results",
    "pyrite.runs",
    "pyrite.validation",
]
forbidden_modules = [
    "pyrite.cli",
]
allow_indirect_imports = true

# `console` is the bottom of the presentation stack: colour, prompts, JSON
# envelopes, the config store and the live dashboard. It may import the path
# constants and the offline catalog reader, or it stops being safe for the
# domain packages to depend on. `materials` is not in the forbidden list below:
# the dashboard resolves one material display label through `CATALOG`, deferred
# to call time, and `materials` is the bottom of the physics core -- it imports
# no peer and no driver, so that edge closes nothing.
[[tool.importlinter.contracts]]
id = "console-stays-below-every-driver"
name = "Console imports no driver or domain package"
type = "forbidden"
source_modules = [
    "pyrite.console",
]
forbidden_modules = [
    "pyrite.apps",
    "pyrite.campaign",
    "pyrite.checkpoints",
    "pyrite.detectors",
    "pyrite.energy_grid",
    "pyrite.montecarlo",
    "pyrite.perf",
    "pyrite.plots",
    "pyrite.remote",
    "pyrite.results",
    "pyrite.runs",
    "pyrite.validation",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "plots-backends-stay-independent"
name = "Plot backends (mpl, altair, plotly) do not import each other"
type = "independence"
modules = [
    "pyrite.plots.mpl",
    "pyrite.plots.altair",
    "pyrite.plots.plotly",
]

[[tool.importlinter.contracts]]
id = "campaign-stays-below-api"
name = "Campaign does not import api"
type = "forbidden"
source_modules = ["pyrite.campaign"]
forbidden_modules = ["pyrite.api"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "results-stays-below-campaign"
name = "Results does not import campaign"
type = "forbidden"
source_modules = ["pyrite.results"]
forbidden_modules = ["pyrite.campaign"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "devtools-stays-below-_dev"
name = "devtools does not import the dev entry point"
type = "forbidden"
source_modules = ["pyrite.devtools"]
forbidden_modules = ["pyrite._dev"]
allow_indirect_imports = true

[tool.ruff]
line-length = 100

# keep this tight; avoid duplicate exclusion logic
exclude = [
    ".venv",
    "__pycache__",
    ".ruff_cache",
    ".pytest_cache",
    "docs/_build",
    "docs/_autosummary",
]

[tool.ruff.lint]
# core useful rules without the “style noise overload”
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade (keeps Python 3.12/3.13 modern)
    "B",   # bugbear (real bugs, not stylistic nitpicks)
]

ignore = [
    "E501",  # long lines in physics formulas/comments
    "E402",  # import-not-at-top — notebook cells have docstrings before imports
    "B008",  # np.deg2rad() in default args — pure math call, not a real bug
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["F821"]  # cross-cell references are always undefined to static analysis
# marimo apps display a cell's value as its bare last
# expression (e.g. a UI element on its own line) -- that's the framework's render
# mechanism, not a useless statement.
"src/pyrite/apps/*_app.py" = ["B018"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv]
cache-dir = "/tmp/pyrite-uv-cache"
conflicts = [
    [
        { extra = "nvidia" },
        { extra = "amd" },
        { extra = "intel" },
    ],
]
