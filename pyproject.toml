[project]
name = "cxr-mc"
version = "0.1.0"
description = "Coherent X-ray radiation (PXR + coherent bremsstrahlung) from table-top electron beams in crystals"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "altair>=6.2.2",
    "anywidget>=0.9",
    "click>=8.4.1",
    "datashader>=0.19.1",
    "crystals>=1.7,<2",
    "marimo[recommended]>=0.23.11",
    "matplotlib>=3.11.0",
    "nbconvert>=7.17.1",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pandoc>=2.4",
    "plotly>=6.0",
    "scipy>=1.17.1",
    "tabulate>=0.10.0",
    "tomlkit>=0.13",
    "vegafusion>=2.0.3",
    "vl-convert-python>=1.9.0.post1",
    "xraydb>=4.5.8",
    "psutil>=7.2.2",
    "kaleido>=1.3.0",
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
]

[project.optional-dependencies]
external-db = [
    "mp-api>=0.46",
]
nvidia = [
    "cupy-cuda13x[ctk]>=14.1.1",
]
# AMD's current ``amd-cupy`` wheels are CPython 3.10-only. cxr-mc requires
# Python 3.13+, so this extra builds upstream CuPy against ROCm instead. It must
# not be installed beside the CUDA CuPy distribution in one environment.
amd = [
    "cupy>=13.4.0",
]
intel = [
    "dpctl>=0.22.1",
    "dpnp>=0.20.0",
]

[project.scripts]
cxr = "cxr_mc.cli:main"
cxr-dev = "cxr_mc._dev:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cxr_mc"]

[dependency-groups]
test = [
    "pytest>=9.1.0",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=7.1.0",
]

lint = [
    "grimp>=3.12",
    "import-linter>=2.9",
    "ruff>=0.15.19",
    "ty>=0.0.63",
    "pre-commit>=4.6.0",
    "nbqa>=1.9.1",
    "nbstripout>=0.9.1",
]

docs = [
    "sphinx>=8.2",
    "myst-parser>=4.0",
    "furo>=2024.8.6",
]

# Independent crystallography oracle. Validation-only; never imported by the
# production package unless an explicit oracle check is requested.
oracle = [
    "Dans-Diffraction==3.4.0",
]


dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.pytest.ini_options]
# Put src/ on the path so `import cxr_mc` resolves without requiring an install
# (an editable install via `uv sync` also works). Tests stay CPU-only/fast -- the
# heavy MC physics validation lives in checks/, not here.
testpaths = ["tests"]
addopts = [
    "-q",
    "--import-mode=importlib"
]
markers = [
    "online: test fetches from an external structure database (COD/MP); skipped unless CXR_ONLINE_TESTS=1",
    "oracle: test requires the pinned optional independent-validation backend",
    "hardware: requires specific physical hardware or device drivers",
    "intel_sycl: requires a working Intel SYCL dpnp/dpctl backend",
]

[tool.coverage.run]
branch = true
source = ["src/cxr_mc"]
parallel = true
# pytest-xdist workers each write their own data file; `coverage combine` (run
# implicitly by pytest-cov) merges them.

[tool.coverage.paths]
# Map an installed/wheel copy back onto the checkout so combined runs from
# different environments do not report the same module twice.
source = ["src/cxr_mc", "*/site-packages/cxr_mc"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
# No `omit` for the compiled paths; read totals with the environment in mind
# instead of hiding modules.
#   - `montecarlo/*_jit_kernel.py` import `cupy` at module scope, so a CPU-only
#     environment reports them 0% (never imported) and the project total drops
#     ~7 points. With the `nvidia` extra installed their host-side code is
#     measured; `cupyx.jit` device bodies stay untraceable regardless.
#   - `@njit` bodies (`montecarlo/transport.py`, `geometry.py`, `groove.py`)
#     run compiled and bypass the Python tracer. Run coverage with
#     `NUMBA_DISABLE_JIT=1` to measure them (~2x wall clock; transport.py
#     37% -> 87%).

[tool.marimo.runtime]
watcher_on_save = "autorun"

[tool.jupytext]
formats = "ipynb,md:myst"

[tool.ty.src]
include = ["src"]

[[tool.ty.overrides]]
include = [
    "src/cxr_mc/montecarlo/*_jit_kernel.py",
    "src/cxr_mc/montecarlo/runner.py",
]

[tool.ty.analysis]
allowed-unresolved-imports = ["cupy*", "cupy*.*"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

[[tool.ty.overrides]]
include = ["src/cxr_mc/apps/**/*.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
invalid-return-type = "ignore"
no-matching-overload = "ignore"

[tool.importlinter]
root_packages = ["cxr_mc"]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
id = "physics-core-stays-below-drivers"
name = "Physics core stays below driver and rendering packages"
type = "forbidden"
source_modules = [
    "cxr_mc.detectors",
    "cxr_mc.materials",
    "cxr_mc.montecarlo",
]
forbidden_modules = [
    "cxr_mc.apps",
    "cxr_mc.checkpoints",
    "cxr_mc.cli",
    "cxr_mc.perf",
    "cxr_mc.plots",
    "cxr_mc.remote",
    "cxr_mc.runs",
    "cxr_mc.validation",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "material-leaves-stay-independent"
name = "Material leaves do not import higher material modules"
type = "forbidden"
source_modules = [
    "cxr_mc.materials._cif",
    "cxr_mc.materials._transport_data",
    "cxr_mc.materials.atomic",
]
forbidden_modules = [
    "cxr_mc.materials.attenuation",
    "cxr_mc.materials.catalog",
    "cxr_mc.materials.crystal",
]
allow_indirect_imports = true

[tool.ruff]
target-version = "py313"
line-length = 100

# keep this tight; avoid duplicate exclusion logic
exclude = [
    ".venv",
    "__pycache__",
    ".ruff_cache",
    ".pytest_cache",
    "docs/_build",
    "docs/_autosummary",
]

[tool.ruff.lint]
# core useful rules without the “style noise overload”
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade (keeps Python 3.12/3.13 modern)
    "B",   # bugbear (real bugs, not stylistic nitpicks)
]

ignore = [
    "E501",  # long lines in physics formulas/comments
    "E402",  # import-not-at-top — notebook cells have docstrings before imports
    "B008",  # np.deg2rad() in default args — pure math call, not a real bug
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["F821"]  # cross-cell references are always undefined to static analysis
# marimo apps display a cell's value as its bare last
# expression (e.g. a UI element on its own line) -- that's the framework's render
# mechanism, not a useless statement.
"src/cxr_mc/apps/*_app.py" = ["B018"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv]
cache-dir = "/tmp/cxr-mc-uv-cache"
conflicts = [
    [
        { extra = "nvidia" },
        { extra = "amd" },
        { extra = "intel" },
    ],
]
