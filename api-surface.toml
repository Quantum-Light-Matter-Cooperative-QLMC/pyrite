# Inventory of supported imports, preserving the contract at main ec61aac9.
# target is the *current* concrete binding; domain is the intended public owner.
# root_role records ownership/stability; root_policy separately classifies root compatibility.
# canonical_facades lists active domain imports; other domains retain existing paths.
schema_version = 1
canonical_facades = ["beams", "geometry", "config", "detectors", "observations", "transport", "radiation"]

[root_exports]
AcquisitionBatch = { target = "pyrite.instrument:AcquisitionBatch", status = "advanced-stable", domain = "results", root_role = "specialized" }
Analysis = { target = "pyrite.campaign.model:Analysis", status = "advanced-stable", domain = "results", root_role = "specialized" }
# Beam's additive quantity boundary (kinetic_energy / with_kinetic_energy)
# retains this class binding, numeric dataclass storage and legacy imports.
Beam = { target = "pyrite.campaign.beam:Beam", status = "stable", domain = "beams", root_role = "core" }
