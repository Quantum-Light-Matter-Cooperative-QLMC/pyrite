# Electron-electron bremsstrahlung ratio eta = chi_e / chi_n (Seltzer and Berger
# 1985, Eq. 19), so the electron-atom scaled SDCS is chi_n * (1 + eta / Z).
# Transcribed from Table 4 of S. M. Seltzer and M. J. Berger, Nucl. Instrum.
# Methods B 12, 95 (1985), for Z = 6, 13, 29, 47, 74, 92; `etabar` is the
# table's ratio of radiative stopping integrals (Eq. 27). Two printed values
# are misprints and are read from their neighbours: Z = 47, 5 MeV, k/T = 0.10
# printed 0.012 (read 1.012); Z = 47, 60 MeV, k/T = 0.70 printed 1.102 (read
# 1.012). The column k/T = 1.00 is zero: k_max < T for an electron target.
#
# `inverse_small_kappa_scale` (1/kappa_s) is not in the source. Table 4 has no
# node between k/T = 0 and 0.1, where eta falls steeply. Between them eta is
#   eta(x) = eta(0.1) + (eta(0) - eta(0.1)) g(x),
#   g(x) = (1/(1 + x/kappa_s) - 1/(1 + 0.1/kappa_s)) / (1 - 1/(1 + 0.1/kappa_s)),
# with kappa_s fitted per row so that the chi_n-weighted mean of eta
# reproduces `etabar` (chi_n from the Seltzer-Berger digital tables, chi_n =
# chi_total / (1 + eta/Z)); 0 means linear. The fitted 1/kappa_s varies with
# Z by at most 8 % from 1 MeV up (32 % at 0.5 MeV), and the stored value is the
# mean over the six elements.
# Below 0.5 MeV eta(0) <= eta(0.1) and the linear rule reproduces etabar
# within 0.004; above 200 MeV the scale is held. Rederive with
# checks/sb85_eta_small_kappa_fit.py.
# Validation: bremslib-electron-electron

