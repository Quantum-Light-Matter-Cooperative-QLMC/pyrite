# above: photoinjector-scale numbers at a waist on the crystal entrance face
# (alpha = 0), with the emittance NORMALIZED so one beam describes the same
# beam at both 30 and 100 keV. The y-plane is omitted, which mirrors x for a
# round beam. See docs/physics/beam-transport/beam-phase-space.md.
