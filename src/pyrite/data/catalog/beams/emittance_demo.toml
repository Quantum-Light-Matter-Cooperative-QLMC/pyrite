# Courant-Snyder injection, the transverse counterpart of the microbunch beams
# (gaussian_200fs, microtrain_200fs, compressed_microbunch):
# photoinjector-scale numbers at a waist on the crystal entrance face
# (alpha = 0), with the emittance NORMALIZED so one beam describes the same
# beam at both 30 and 100 keV. The y-plane is omitted, which mirrors x for a
# round beam. See docs/physics/beam-transport/beam-phase-space.md.
label = "Courant-Snyder demo, 0.1 mm mrad normalized"
rep_rate_hz = 5000.0
bunch_charge_pc = 1.0
energy_spread_frac = 0.001

[transverse]
normalized_emittance_x_mm_mrad = 0.1
beta_twiss_x_m = 0.05
alpha_twiss_x = 0.0
