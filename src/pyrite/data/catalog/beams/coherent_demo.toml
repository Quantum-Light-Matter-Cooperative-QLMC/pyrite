# Demo beam for the coherent_demo profile: an attosecond bunch, short enough
# that the coherent PXR term survives, with a 0.1 mm spot that stays well
# inside the crystal footprint for the finite-footprint transverse average.
label = "Coherent demo: 1 as bunch, 0.1 mm spot"
transverse_fwhm_mm = 0.1
rep_rate_hz = 5000.0
bunch_charge_pc = 1.0

[longitudinal]
kind = "gaussian"
envelope_rms_fs = 0.001
