# A brem grid's `start` is a *lower bound the profile asks for*, not the band
# it gets: the photon-continuum floor belongs to the medium, not to the profile
# that declared the band, so it is resolved per material in
# campaign/sweep.py::build_cases (energy_grid/floor.py::
# floored_lattice_start_eV) and a declared `start` below it is raised there.
# `0.0` therefore reads as "no bound beyond the medium's own", which is what a
# profile-level default -- naming no medium -- can honestly say. The
# per-material overrides below carry each medium's own resolved value, which is
# what `pyrite material energy-grid derive` writes; a stored per-profile value
# must never *differ* per profile for the same material, or two profiles stop
# sharing the cases they are supposed to share
# (tests/materials/test_profiles.py::
# test_case_content_key_matches_across_profiles_for_shared_cases).
