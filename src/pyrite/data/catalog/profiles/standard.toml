beam = "example"
detector = "default"
materials = ["hopg", "hbn", "hfte2", "mos2", "mote2", "nbte2", "pds2", "pdse2", "pdte2", "pts2", "ptse2", "ptte2", "2h_tas2", "2h_tase2", "tate2", "v2o5", "vse2", "ws2", "wse2", "wte2", "zrte3"]
thickness_ang = { values = [1000.0, 5000.0, 10000.0, 40000.0, 100000.0, 200000.0, 500000.0, 1000000.0, 10000000.0] }
energy_keV = { values = [30.0, 40.0, 50.0, 60.0, 100.0, 150.0, 200.0, 250.0, 300.0] }
tilt_deg = { values = [5.0, 15.0, 30.0, 45.0, 60.0, 75.0, 85.0] }
tilt_azim_deg = { values = [95.0, 105.0, 120.0, 135.0, 150.0, 165.0, 180.0] }
# At full fidelity a uniform brem grid contributes only its `step` to a case
# (the deprecated survey preset also crops it). Its `start` is a
# lower bound the profile asks for: the photon-continuum floor belongs to the
# medium, so campaign/sweep.py::build_cases raises it per material
# (energy_grid/floor.py::floored_lattice_start_eV). Its `stop` is replaced per
# case by E0 + step, so the grid always reaches the beam energy. No per-material
# uniform override is needed; only a nonuniform (e.g. geometric) grid is a real
# per-material limit (tests/materials/test_profiles.py::
# test_case_content_key_matches_across_profiles_for_shared_cases).
E_grid_brem = { arange = { start = 0.0, stop = 30000.0, step = 25.0 } }

[overrides.mote2_product]
thickness_layers = { values = [3, 4, 5, 6] }

[overrides.mos2-on-sapphire]
thickness_layers = 3

[overrides.mos2-on-sio2-si]
thickness_layers = { values = [3, 4, 5, 6] }

[overrides.sapphire]
thickness_ang = 5000000.0
