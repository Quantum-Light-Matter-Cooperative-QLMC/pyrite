# Demo: 1 MeV beam with the measured line-grid policy (resonance-population
# bandwidth, uniform sinc-oversampled spacing at the bin-mean shape step,
# bin-mean quadrature). An axis above the coordinate budget refuses and names
# sinc-nyquist or resonance-local as the opt-outs. The line grid is
# resolved automatically, independently of electron sampling, which uses the
# default adaptive policy (pyrite profile numerics adaptive-sampling show high_energy_demo).
#   pyrite run high_energy_demo

thickness_ang = {values = [10000.0]}
energy_keV = {values = [1000.0]}
tilt_deg = {values = [45.0]}
tilt_azim_deg = {values = [180.0]}
materials = ["hopg"]
beam = "example"
detector = "reference"

[cxr_grid_policy]
bandwidth = "resonance-population"
resolution = "sinc-oversampled"
quadrature = "bin-mean"
