# Demo: 1 MeV beam with the measured line-grid policy (resonance-population
# bandwidth, resonance-local spacing, bin-mean quadrature). The line grid is
# resolved automatically, independently of electron sampling, which uses the
# default adaptive policy (pyrite profile precision show high_energy_demo).
# ~1 min on CPU.
#   pyrite run high_energy_demo

thickness_ang = {values = [10000.0]}
energy_keV = {values = [1000.0]}
tilt_deg = {values = [45.0]}
tilt_azim_deg = {values = [180.0]}
E_grid_brem = {arange = {start = 0.0, stop = 30000.0, step = 25.0}}
materials = ["hopg"]
detector = "default"

[line_grid_policy]
bandwidth = "resonance-population"
resolution = "resonance-local"
quadrature = "bin-mean"
