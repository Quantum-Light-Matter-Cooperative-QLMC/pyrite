# One compact scattering case for saved-trajectory inspection. Fixed counts
# permit HDF5 capture; the micron-scale beam keeps the histories close together.
materials = ["hopg"]
beam = "trajectory_demo"
detector = "reference"
thickness_ang = { values = [20000.0] }
energy_keV = { values = [30.0] }
tilt_deg = { values = [45.0] }
tilt_azim_deg = { values = [180.0] }
cxr_trials = { values = [100] }
brem_trials = { values = [100] }
