# Measured valence-plasmon parameters for PENELOPE-2024 conduction-band
# oscillators (Sec. 3.2.1): f_cb is the number of electrons per formula unit
# that take part in plasmon excitation, W_cb the plasmon energy. Keys are
# catalog crystal or medium keys; `formula` must equal the SBETHE formula
# counts. f_cb is the chemical valence count and must consume whole outermost
# pdatconf.p14 shells. Validation: penelope-shell-oscillators

[silicon]
formula = { Si = 1 }
electrons_per_formula = 4
resonance_eV = 16.7
basis = "maximum of the REELS-derived optical energy-loss function (0.1 eV grid)"
source = "L. H. Yang et al., Phys. Rev. B 100, 245209 (2019)"
doi = "10.1103/PhysRevB.100.245209"

[sio2]
formula = { Si = 1, O = 2 }
electrons_per_formula = 16
resonance_eV = 22.0
basis = "broad q=0 volume-plasmon peak in AR-EELS of amorphous SiO2, matching the catalog's amorphous density (2.20 g/cm3); REELS ELF maximum 23.6 eV for a 2.65 g/cm3 sample (Da et al., J. Appl. Phys. 113, 214303 (2013), doi:10.1063/1.4809544)"
source = "T. Saito, Y. K. Sato and M. Terauchi, Microscopy 74, 117 (2025)"
doi = "10.1093/jmicro/dfae056"

[mos2]
formula = { Mo = 1, S = 2 }
electrons_per_formula = 18
resonance_eV = 23.0
basis = "pi+sigma bulk plasmon peak in thick-terrace STEM-EELS, reported as around 23 eV; the separate 8.6 eV pi plasmon is not represented"
source = "E. Moynihan et al., J. Microsc. 279, 256 (2020)"
doi = "10.1111/jmi.12900"

[hopg]
formula = { C = 1 }
electrons_per_formula = 4
resonance_eV = 25.0
basis = "pi+sigma maximum of the optical energy-loss function -Im(1/eps) (q=0, E perpendicular to c, i.e. in-plane q as for c-normal incidence) from Kramers-Kronig analysis of reflectance measured to 26 eV; the separate 7 eV pi plasmon is not represented; EELS on a graphite single crystal gives 28 eV at q=0.25 A^-1 in-plane (Marinopoulos et al., Phys. Rev. Lett. 89, 076402 (2002), doi:10.1103/PhysRevLett.89.076402)"
source = "E. A. Taft and H. R. Philipp, Phys. Rev. 138, A197 (1965)"
doi = "10.1103/PhysRev.138.A197"

[hbn]
formula = { B = 1, N = 1 }
electrons_per_formula = 8
resonance_eV = 26.4
basis = "total (sigma+pi) bulk plasmon in low-q transmission EELS with q in the basal plane (Kramers-Kronig-analysed 0-60 eV loss function); q along c gives 23 eV; the separate 8.5 eV pi plasmon is not represented"
source = "C. Tarrio and S. E. Schnatterly, Phys. Rev. B 40, 7852 (1989)"
doi = "10.1103/PhysRevB.40.7852"

[wse2]
formula = { W = 1, Se = 2 }
electrons_per_formula = 18
resonance_eV = 22.0
basis = "volume plasmon of all valence electrons, reported as about 22 eV in transmission EELS at q=0.1 A^-1 along Gamma-M (in-plane, optical limit) on ~100 nm 2H films exfoliated from single crystals, 20 K"
source = "M. Ahmad et al., J. Phys.: Condens. Matter 29, 165502 (2017)"
doi = "10.1088/1361-648X/aa63a7"
