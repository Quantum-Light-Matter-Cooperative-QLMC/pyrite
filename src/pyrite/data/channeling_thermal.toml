# Per-site thermal displacement data for quantum channeling profiles
# (ADR-0018, issue #503). Kept outside the crystal catalog: PXR/CBS keep
# reading the catalog scalar `B_ang2`, and its provenance audit
# (`debye-waller-catalog-provenance`) defers any catalog schema change.
#
# Keys: [<catalog crystal key>.<element>]. `B_ang2[i]` is the isotropic
# Debye--Waller B = 8 pi^2 <u_x^2> [angstrom^2] at `temperatures_K[i]`, derived
# from the phonon density of states. The Peng et al. rows are transcribed from
# that source's Table 1 at the temperatures whose values were unambiguous in
# the published layout (170-280 K); other rows state their own table and range. `atomic_weight` uses the 12C = 12 scale of the
# source's Debye formula, which extrapolates outside the tabulated range.
# Validation: cr-debye-b-of-t

[silicon.Si]
atomic_weight = 28.0855
temperatures_K = [170.0, 180.0, 190.0, 210.0, 220.0, 230.0, 240.0, 260.0, 270.0, 280.0]
B_ang2 = [0.2814, 0.2979, 0.3145, 0.3476, 0.3641, 0.3807, 0.3972, 0.4303, 0.4469, 0.4634]
source = "L.-M. Peng, G. Ren, S. L. Dudarev, M. J. Whelan, Acta Cryst. A52, 456 (1996), Table 1 (phonon-DOS derived)"
doi = "10.1107/S010876739600089X"

[diamond.C]
atomic_weight = 12.011
temperatures_K = [170.0, 180.0, 190.0, 210.0, 220.0, 230.0, 240.0, 260.0, 270.0, 280.0]
B_ang2 = [0.1336, 0.1342, 0.1349, 0.1363, 0.1370, 0.1378, 0.1386, 0.1403, 0.1412, 0.1422]
source = "L.-M. Peng, G. Ren, S. L. Dudarev, M. J. Whelan, Acta Cryst. A52, 456 (1996), Table 1 (phonon-DOS derived)"
doi = "10.1107/S010876739600089X"

[tungsten.W]
atomic_weight = 183.84
temperatures_K = [170.0, 180.0, 190.0, 210.0, 220.0, 230.0, 240.0, 260.0, 270.0, 280.0]
B_ang2 = [0.0927, 0.0981, 0.1036, 0.1145, 0.1199, 0.1254, 0.1308, 0.1417, 0.1471, 0.1526]
source = "L.-M. Peng, G. Ren, S. L. Dudarev, M. J. Whelan, Acta Cryst. A52, 456 (1996), Table 1 (phonon-DOS derived)"
doi = "10.1107/S010876739600089X"

# GaAs (#1178): Schowalter et al. (2009) Table 6, LDA phonon-DOS <u^2>
# converted as B = 8 pi^2 <u^2>; columns 100-600 K (the 0.001 K column sits
# where linear interpolation would misrepresent the zero-point plateau, so
# below 100 K the Debye extrapolation applies). The LDA value at 287 K matches
# the measured Stahn et al. (1998) <u^2> (Ga 0.00844, As 0.00716 angstrom^2)
# to <=1.4% (paper, Sec. 4); linear interpolation of these rows gives B(287 K)
# within +0.5% (Ga) and +1.9% (As) of the measurement.
[gaas.Ga]
atomic_weight = 69.723
temperatures_K = [100.0, 200.0, 400.0, 600.0]
B_ang2 = [0.2682, 0.4767, 0.9205, 1.3713]
source = "M. Schowalter, A. Rosenauer, J. T. Titantah, D. Lamoen, Acta Cryst. A65, 5 (2009), Table 6 (LDA, phonon-DOS derived)"
doi = "10.1107/S0108767308031437"

[gaas.As]
atomic_weight = 74.9216
temperatures_K = [100.0, 200.0, 400.0, 600.0]
B_ang2 = [0.2328, 0.4107, 0.7907, 1.1772]
source = "M. Schowalter, A. Rosenauer, J. T. Titantah, D. Lamoen, Acta Cryst. A65, 5 (2009), Table 6 (LDA, phonon-DOS derived)"
doi = "10.1107/S0108767308031437"

# Uniaxial single-temperature rows (#535). `model = "uniaxial_c"` gives the
# mean-square displacement <u^2> [angstrom^2] along one basal axis
# (`u_basal_ang2`) and along c (`u_c_ang2`); every site of the element must be
# symmetry-equivalent. Valid only at `temperature_K +- tolerance_K`; never
# extrapolated (ADR-0018). The planar potential uses their plane-normal
# projection; TDS uses the transverse block of the full covariance (#535).
# Validation: cr-uniaxial-thermal-projection
#
# 2H-MoS2: Schoenfeld, Huang & Moss (1983), Table 3, 2H row, values without the
# TDS correction (TDS-corrected values agree within error). Room temperature is
# not stated numerically; 295 +- 10 K is the declared admissible window.
[mos2.Mo]
model = "uniaxial_c"
atomic_weight = 95.95
temperature_K = 295.0
tolerance_K = 10.0
u_basal_ang2 = 0.0048
u_c_ang2 = 0.0077
source = "B. Schoenfeld, J. J. Huang, S. C. Moss, Acta Cryst. B39, 404 (1983), Table 3 (2H-MoS2, X-ray, room temperature)"
doi = "10.1107/S0108768183002645"

[mos2.S]
model = "uniaxial_c"
atomic_weight = 32.06
temperature_K = 295.0
tolerance_K = 10.0
u_basal_ang2 = 0.0038
u_c_ang2 = 0.0049
source = "B. Schoenfeld, J. J. Huang, S. C. Moss, Acta Cryst. B39, 404 (1983), Table 3 (2H-MoS2, X-ray, room temperature)"
doi = "10.1107/S0108768183002645"
