    { element = "Te", pos = [0.3333333333333333, 0.6666666666666667, 0.621] },
]

# 1T (CdI2-type, P-3m1) metal dichalcogenides: heavy metal on Wyckoff 1a (0,0,0)
# -- AT THE ORIGIN, so every (00l) stays strong (unlike the 2H TMDs where the
# metal at z=1/4,3/4 makes them oscillate) -- and chalcogen on 2d (1/3,2/3,z),
# (2/3,1/3,1-z) with z ~ 0.255. One layer per cell, so c is the interlayer
# repeat. Bond sqrt((a/sqrt(3))^2 + (z c)^2) ~ 2.5 A.
[ptse2]
system = "hexagonal"
a = 3.728
c = 5.081
basis = [
    { element = "Pt", pos = [0.0, 0.0, 0.0] },
    { element = "Se", pos = [0.3333333333333333, 0.6666666666666667, 0.255] },
    { element = "Se", pos = [0.6666666666666667, 0.3333333333333333, 0.745] },
]

# 1T-HfS2 (CdI2-type, P-3m1 #164): one HfS2 formula unit per primitive
# hexagonal cell, with Hf on 1a and S on 2d. The product crystal reports
# a=b=3.62 A and c=5.80 A; Neal et al., npj 2D Mater. Appl. 5, 45 (2021)
# independently identify the vendor-grown bulk crystal as 1T P-3m1. The
# idealized octahedral coordinate z=0.25 gives an Hf-S bond of 2.54 A,
# consistent with the reported ~2.53 A. In the limiting basal case, one layer
# per cell means (001) is allowed (unlike the cancelled odd 00l of 2H TMDs).
# Validation: hfs2-structure
[hfs2]
system = "hexagonal"
a = 3.62
c = 5.80
basis = [
    { element = "Hf", pos = [0.0, 0.0, 0.0] },
    { element = "S",  pos = [0.3333333333333333, 0.6666666666666667, 0.25] },
    { element = "S",  pos = [0.6666666666666667, 0.3333333333333333, 0.75] },
]

[hfse2]
system = "hexagonal"
