    { element = "V", pos = [0.60118, 0.75, 0.1083] },
    { element = "O", pos = [0.1043, 0.25, 0.531] },
    { element = "O", pos = [0.3957, 0.25, 0.531] },
    { element = "O", pos = [0.8957, 0.75, 0.469] },
    { element = "O", pos = [0.6043, 0.75, 0.469] },
    { element = "O", pos = [0.9311, 0.25, 0.003] },
