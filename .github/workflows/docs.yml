name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pyrite
        with:
          environment: docs

      - name: Check generated references
        run: |
          pixi run --locked -e docs pyrite-dev cli-reference --check
          pixi run --locked -e docs pyrite-dev validation-ledger --check

      # CI/full runs verify (including the same docs gate) for PRs to main.
      # Keep this check job and its reference checks for existing branch rules.
      - name: Build Sphinx documentation
        if: github.event_name != 'pull_request'
        run: pixi run --locked -e docs pyrite-dev docs
