name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.85.0
          environments: docs
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Check generated references
        run: |
          pixi run --locked -e docs pyrite-dev cli-reference --check
          pixi run --locked -e docs pyrite-dev validation-ledger --check

      - name: Build Sphinx documentation
        run: >
          pixi run
          --locked
          -e docs
          sphinx-build
          -W
          --keep-going
          -j auto
          -b html
          docs
          docs/_build/html
