name: Release and publish to PyPI

# Pushing a vX.Y.Z tag on the merged release commit publishes its GitHub
# Release, then builds and publishes to PyPI (docs/repo-design/releasing.md).
# The tag must match __version__.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Notes span the previous v* tag, so tags and history are needed.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"

      - name: Render release notes
        # Runtime dependencies only: pyrite-dev needs the lint toolchain.
        run: >
          uv run --locked --no-default-groups
          python -m pyrite.devtools.release "$GITHUB_REF_NAME" --notes-file release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --latest
          --title "PyRITE ${GITHUB_REF_NAME#v}"
          --notes-file release-notes.md

  build:
    name: Build distributions
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"

      - name: Build package
        run: uv build

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

      - name: Audit distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile

          MAX_SDIST_MIB = 5

          for archive in Path("dist").glob("*.tar.gz"):
              size_mib = archive.stat().st_size / 1024**2

              print(f"{archive.name}: {size_mib:.2f} MiB")

              assert size_mib < MAX_SDIST_MIB, (
                  f"Source distribution exceeds {MAX_SDIST_MIB} MiB"
              )

              with tarfile.open(archive) as tar:
                  names = [
                      member.name.split("/", 1)[-1]
                      for member in tar.getmembers()
                  ]

              forbidden = (
                  ".serena/",
                  ".claude/",
                  ".agents/",
                  "agentdocs/",
                  ".import_linter_cache/",
                  ".grimp_cache/",
              )

              unexpected = [
                  name for name in names
                  if name.startswith(forbidden)
              ]

              assert not unexpected, (
                  f"Unexpected files in sdist: {unexpected[:10]}"
              )
          PY

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyrite-mc
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
