name: Release and publish to PyPI

# Pushing a vX.Y.Z tag builds, audits and smoke-tests the distributions before
# publishing the GitHub Release and then PyPI (docs/repo-design/releasing.md).
# The tag must match __version__.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Notes span the previous v* tag, so tags and history are needed.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-pyrite
        with:
          environment: docs

      - name: Render release notes
        # The light docs environment: runtime plus Sphinx, no lint toolchain.
        run: >
          pixi run --locked -e docs
          python -m pyrite.devtools.release "$GITHUB_REF_NAME" --notes-file release-notes.md

      # Zenodo's GitHub integration archives every published release of this
      # repository into the *software* DOI family, so only v* code releases are
      # published here. Table data goes to the separate Zenodo dataset record
      # (docs/repo-design/releasing.md#zenodo-archive-separation).
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --latest
          --title "PyRITE ${GITHUB_REF_NAME#v}"
          --notes-file release-notes.md

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-pyrite
        with:
          environment: default

      - name: Validate release tag
        run: pixi run --locked python -m pyrite.devtools.release "$GITHUB_REF_NAME"

      - name: Build package
        run: pixi run --locked python -m build --outdir dist .

      - name: Check distributions
        run: pixi exec --spec twine twine check dist/*

      - name: Audit distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile

          MAX_SDIST_MIB = 5

          for archive in Path("dist").glob("*.tar.gz"):
              size_mib = archive.stat().st_size / 1024**2

              print(f"{archive.name}: {size_mib:.2f} MiB")

              assert size_mib < MAX_SDIST_MIB, (
                  f"Source distribution exceeds {MAX_SDIST_MIB} MiB"
              )

              with tarfile.open(archive) as tar:
                  names = [
                      member.name.split("/", 1)[-1]
                      for member in tar.getmembers()
                  ]

              forbidden = (
                  ".serena/",
                  ".claude/",
                  ".agents/",
                  "agentdocs/",
                  ".import_linter_cache/",
                  ".grimp_cache/",
              )

              unexpected = [
                  name for name in names
                  if name.startswith(forbidden)
              ]

              assert not unexpected, (
                  f"Unexpected files in sdist: {unexpected[:10]}"
              )
          PY

      - name: Clean-install smoke of the built wheel and sdist
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          shopt -s nullglob
          wheels=("$PWD"/dist/*.whl)
          sdists=("$PWD"/dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          for artifact in "${wheels[@]}" "${sdists[@]}"; do
            pixi run --locked python -m venv "$work/venv"
            (
              cd "$work"
              unset PYTHONPATH PYTHONHOME
              export PYTHONNOUSERSITE=1
              "$work/venv/bin/python" -m pip install "$artifact"
              "$work/venv/bin/python" -m pip check
              "$work/venv/bin/python" -c 'import os, pyrite; assert "v" + pyrite.__version__ == os.environ["GITHUB_REF_NAME"]'
              "$work/venv/bin/pyrite" run --help
            )
            rm -rf -- "$work/venv"
          done

      - name: Upload distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build, release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyrite-mc
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: python-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1 snapshot
