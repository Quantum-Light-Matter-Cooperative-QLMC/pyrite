name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        suite: [core, cli, apps, packaging]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Test ${{ matrix.suite }} suite
        run: uv run pyrite-dev test-suite ${{ matrix.suite }}

  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv sync --all-groups --locked

      - name: Verify
        run: uv run pyrite-dev verify
