name: CI

on:
  pull_request:
    branches: [main]

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        suite: [core, cli, apps, packaging]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Test ${{ matrix.suite }} suite
        run: |
          if [ "${{ matrix.suite }}" = core ]; then
            uv run pyrite-dev test-suite core -n 2 --dist loadfile --durations=30 --durations-min=0.5
          else
            uv run pyrite-dev test-suite "${{ matrix.suite }}"
          fi

  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
      - run: uv sync --all-groups --locked

      - name: Verify non-test gates
        run: uv run pyrite-dev verify --skip-tests
