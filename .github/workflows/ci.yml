name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        suite: [core, cli, apps, packaging]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --all-groups --locked

      # EEDL, EADL, SBETHE sdbase/ and the ELSEPA tables are hash-pinned
      # fetched data, not packaged (ADR-0014, #263, #284). The key follows the
      # pins, so a repin refetches; a cache hit needs no network. `fetch`
      # re-verifies a cached copy and exits 0. The ELSEPA archive is a private
      # release asset, read with this job's GITHUB_TOKEN (fork PRs may lack
      # access).
      - name: Cache pinned data
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pyrite/datasets
            ~/.local/share/pyrite/xsgen/tables
            ~/.local/share/pyrite/xsgen/reference-data
          key: pyrite-data-${{ hashFiles('src/pyrite/datasets.py', 'src/pyrite/xsgen/fetch.py', 'src/pyrite/data/xsgen/elsepa-tables.json') }}

      - name: Fetch pinned data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run pyrite tables fetch eedl
          uv run pyrite tables fetch eadl
          uv run pyrite tables fetch sbethe
          uv run pyrite tables fetch elsepa

      - name: Test ${{ matrix.suite }} suite
        run: |
          if [ "${{ matrix.suite }}" = core ]; then
            uv run pyrite-dev test-suite core --durations=30 --durations-min=0.5
          else
            uv run pyrite-dev test-suite "${{ matrix.suite }}"
          fi

  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
      - run: uv sync --all-groups --locked

      - name: Verify non-test gates
        run: uv run pyrite-dev verify --skip-tests
