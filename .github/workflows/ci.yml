name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        suite: [core, cli, apps, packaging]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --all-groups --locked

      # Every hash-pinned fetched dataset and table release (ADR-0014): EEDL,
      # EADL, EPDL, SBETHE sdbase/ and catalogue tables, ELSEPA, BremsLib, and
      # the positron SBETHE/ELSEPA pins (#263, #282, #284, #385). Positron
      # tests fail rather than skip under CI when those tables are absent. The key follows the pins, so a repin refetches; a
      # cache hit needs no network. `fetch` re-verifies a cached copy and
      # exits 0. PyRITE's own archives are public release assets and can be
      # fetched without a token.
      - name: Cache pinned data
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pyrite/datasets
            ~/.local/share/pyrite/xsgen/tables
            ~/.local/share/pyrite/xsgen/reference-data
          key: pyrite-data-${{ hashFiles('src/pyrite/datasets.py', 'src/pyrite/xsgen/fetch.py', 'src/pyrite/data/xsgen/*-tables.json') }}

      - name: Fetch pinned data
        run: uv run pyrite tables fetch

      - name: Test ${{ matrix.suite }} suite
        # Every PR runs the opt-in slow tier too (#381).
        env:
          PYRITE_SLOW_TESTS: "1"
        run: |
          if [ "${{ matrix.suite }}" = core ]; then
            uv run pyrite-dev test-suite core --durations=30 --durations-min=0.5
          else
            uv run pyrite-dev test-suite "${{ matrix.suite }}"
          fi

  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
      - run: uv sync --all-groups --locked

      - name: Verify non-test gates
        run: uv run pyrite-dev verify --skip-tests
