name: CI

on:
  pull_request:
    # Stacked issue PRs need the same CI as PRs targeting main.
    branches: [main, "issue-*"]
  push:
    branches: [main]
  schedule:
    # Weekly full CPU test matrix; the CUDA parity run is lab-only.
    - cron: '53 6 * * 0'
  # Bot commits made with GITHUB_TOKEN need an explicit CI dispatch.
  workflow_dispatch:
    inputs:
      slow:
        description: Add the weekly slow tier to the JIT-disabled job
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      quantum: ${{ steps.filter.outputs.quantum || 'false' }}
      python_next: ${{ steps.filter.outputs.python_next || 'false' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            quantum:
              - '.github/workflows/ci.yml'
              - 'src/pyrite/montecarlo/channeling/**'
              - 'src/pyrite/apps/axial_channeling.py'
              - 'src/pyrite/apps/channeling_app.py'
              - 'src/pyrite/materials/channeling/**'
              - 'tests/montecarlo/quantum/**'
              - 'tests/montecarlo/channeling/**'
              - 'tests/materials/test_channeling_*.py'
              - 'tests/notebooks/test_channeling_app.py'
              - 'checks/axial_*.py'
              - 'docs/guides/experimental-*-channeling.md'
              - 'docs/guides/index.md'
              - 'docs/research/physics/axial-*.md'
              - 'docs/validation/channeling/**'
              - 'docs/validation/ledger-channeling.md'
            python_next:
              - '.github/workflows/ci.yml'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'src/pyrite/devtools/package_smoke.py'

  format:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: format-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # Format the source commit, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.85.0
          environments: py314
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Format code
        run: pixi run --locked -e py314 pyrite-dev format

      - name: Regenerate CLI reference
        run: pixi run --locked pyrite-dev cli-reference --write

      - name: Commit formatting and generated-reference fixes
        id: commit
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          mapfile -d '' paths < <(
            git diff --name-only -z -- '*.py' '*.pyi' '*.ipynb' \
              'docs/repo-design/cli/cli-reference*.md'
          )
          if [ "${#paths[@]}" -eq 0 ]; then
            exit 0
          fi
          git add -- "${paths[@]}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply Ruff formatting and regenerate CLI reference'
          # A normal push refuses to overwrite a branch updated during this job.
          git push origin "HEAD:refs/heads/$PR_BRANCH"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Run CI on the formatting commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BRANCH: ${{ github.head_ref }}
        run: gh workflow run ci.yml --ref "$PR_BRANCH"

  focused:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        suite:
          - core
          - transport
          - transport-collisions
          - transport-cascades
          - transport-runner
          - spectrum
          - spectrum-coherent
          - spectrum-brem
          - channeling
          - energy-grid
          - materials
          - xsgen
          - cli
          - apps
          - packaging
        # Python 3.13 is the `default` pixi environment, 3.14 is `py314`.
        environment: [default, py314]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.85.0
          environments: ${{ matrix.environment }}
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      # Every hash-pinned fetched dataset and table release (ADR-0014): EEDL,
      # EADL, EPDL, SBETHE sdbase/ and catalogue tables, ELSEPA, BremsLib, and
      # the positron SBETHE/ELSEPA pins (#263, #282, #284, #385). Positron
      # tests fail rather than skip under CI when those tables are absent. The key follows the pins, so a repin refetches; a
      # cache hit needs no network. `fetch` re-verifies a cached copy and
      # exits 0. PyRITE's own archives are public release assets and can be
      # fetched without a token.
      - name: Cache pinned data
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pyrite/datasets
            ~/.local/share/pyrite/xsgen/tables
            ~/.local/share/pyrite/xsgen/reference-data
          key: pyrite-data-${{ hashFiles('src/pyrite/datasets.py', 'src/pyrite/xsgen/fetch.py', 'src/pyrite/data/xsgen/*-tables.json') }}

      - name: Fetch pinned data
        run: pixi run -e ${{ matrix.environment }} pyrite tables fetch

      - name: Test ${{ matrix.suite }} suite
        # Every PR runs the opt-in slow tier too (#381).
        env:
          PYRITE_SLOW_TESTS: "1"
        run: pixi run -e ${{ matrix.environment }} pyrite-dev test-suite "${{ matrix.suite }}" --durations=30 --durations-min=0.5

  quantum:
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.quantum == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Python 3.13 is the `default` pixi environment, 3.14 is `py314`.
        environment: [default, py314]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.85.0
          environments: ${{ matrix.environment }}
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Cache pinned data
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pyrite/datasets
            ~/.local/share/pyrite/xsgen/tables
            ~/.local/share/pyrite/xsgen/reference-data
          key: pyrite-data-${{ hashFiles('src/pyrite/datasets.py', 'src/pyrite/xsgen/fetch.py', 'src/pyrite/data/xsgen/*-tables.json') }}

      - name: Fetch pinned data
        run: pixi run -e ${{ matrix.environment }} pyrite tables fetch

      - name: Test quantum suite
        env:
          PYRITE_SLOW_TESTS: "1"
        run: pixi run -e ${{ matrix.environment }} pyrite-dev test-suite quantum --durations=30 --durations-min=0.5

  # Provisional Python 3.15 probe (#1421). Nonblocking: 3.15 is not a
  # supported version until pyproject classifiers and docs say so. h5py,
  # gemmi and endf-parserpy publish no cp315 wheels yet, so they build from
  # source: HDF5 headers for h5py, nanobind<3 for gemmi 0.7.5 (gemmi#442),
  # and one endf-parserpy compile job (its default uses every core and
  # exceeds runner memory). The oracle group is skipped: abtem needs pyFFTW,
  # which has neither cp315 wheels nor FFTW headers here. Accelerator extras
  # have no cp315 wheels; CPU success never implies GPU support.
  python-next:
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.python_next == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UV_PYTHON: "3.15"
      HDF5_INCLUDEDIR: /usr/include/hdf5/serial
      HDF5_LIBDIR: /usr/lib/x86_64-linux-gnu/hdf5/serial
      INSTALL_ENDF_PARSERPY_NUM_BUILD_JOBS: "1"
      UV_CONCURRENT_BUILDS: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.15"

      - name: Install source-build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libhdf5-dev

      # `uv sync` ignores --build-constraint/UV_BUILD_CONSTRAINT; build the
      # locked gemmi once with nanobind<3 so sync reuses the cached wheel
      # without changing pyproject.toml or uv.lock.
      - name: Prebuild gemmi
        run: |
          gemmi_version=$(uv export --locked --no-hashes --all-groups --no-group oracle \
            | sed -n 's/^gemmi==\([^ ;]*\).*/\1/p')
          echo 'nanobind<3' > "$RUNNER_TEMP/build-constraints.txt"
          uv venv "$RUNNER_TEMP/prebuild"
          uv pip install --python "$RUNNER_TEMP/prebuild" "gemmi==$gemmi_version" \
            --build-constraint "$RUNNER_TEMP/build-constraints.txt"

      - name: Install dependencies
        run: uv sync --all-groups --no-group oracle --locked

      - name: Cache pinned data
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pyrite/datasets
            ~/.local/share/pyrite/xsgen/tables
            ~/.local/share/pyrite/xsgen/reference-data
          key: pyrite-data-${{ hashFiles('src/pyrite/datasets.py', 'src/pyrite/xsgen/fetch.py', 'src/pyrite/data/xsgen/*-tables.json') }}

      - name: Fetch pinned data
        run: uv run pyrite tables fetch

      - name: Interpreter and GIL state
        run: >-
          uv run python -c "import sys, numba, numpy, h5py, gemmi, pyrite;
          print(sys.version, 'gil', sys._is_gil_enabled())"

      - name: Packaging and identity pins
        run: |
          uv run pyrite-dev test-suite packaging
          uv run pyrite-dev test-suite identity-pins

      - name: RNG, baseline, checkpoint and bounded transport/radiation
        run: >-
          uv run pyrite-dev test
          tests/montecarlo/runner/test_physics_baseline.py
          tests/montecarlo/runner/test_block_transport.py
          tests/montecarlo/collisions/test_straggling_rng_plumbing.py
          tests/montecarlo/runner/test_cxr_source_run.py
          tests/montecarlo/runner/test_case.py
          tests/montecarlo/runner/test_stream_overlap.py
          tests/montecarlo/runner/test_history_shards.py
          tests/scan/test_run.py
          tests/checkpoint/test_io.py
          tests/checkpoint/test_selective_load.py
          tests/test_jit_cache.py
          tests/test_root_namespace.py
          tests/test_paths.py

      - name: Wheel and editable install smoke
        run: uv run pyrite-dev package-smoke

  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.85.0
          environments: py314
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      # Includes a non-mutating format check for fork PRs too.
      - name: Verify non-test gates
        run: pixi run -e py314 pyrite-dev verify
      - name: Check agent skills
        run: pixi run -e py314 pyrite-dev check-skills
      - name: Check generated repository map
        run: pixi run -e py314 pyrite-dev repo-map --check

  # Keep the existing JIT-compiled suite above. Here --numba intentionally
  # disables JIT to exercise Python-level Numba bodies; it does NOT test
  # compiled kernels. Online tests run separately on push/main and weekly.
  # Main pushes skip the slow tier (PRs run it compiled); the weekly run and
  # a dispatch with slow=true keep it. Runners
  # act as ~2 cores (4 workers cost 1.6-2.5x per test), so 2 workers per shard.
  # Transport and runner each own a budget. Core runs independently of data
  # suites so a slow core cannot starve them (#1367, main run 44928520114).
  numba-online:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: collisions
            suites: transport-collisions
          - shard: transport
            suites: transport
          - shard: runner
            suites: transport-runner
          - shard: spectrum
            suites: >-
              transport-cascades spectrum
              spectrum-coherent spectrum-brem channeling quantum
          - shard: core
            suites: core
          - shard: data
            suites: packaging apps cli energy-grid materials xsgen
    runs-on: ubuntu-latest
    # Main pushes fit 60 min (#1367, run 44952391262: slowest shard 43 min).
    # The slow tier's transport shard holds ~95 test-minutes on two workers
    # (run 44963024170), so weekly and slow=true runs get 90.
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.slow) && 90 || 60 }}
    env:
      NUMBA_DISABLE_JIT: '1'
      PYRITE_MC_BACKEND: cpu
      PYRITE_ONLINE_TESTS: '1'
      PYRITE_TEST_WORKERS: '2'
      SUITES: ${{ matrix.suites }}
      SLOW: ${{ (github.event_name == 'schedule' || inputs.slow) && '--slow' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.85.0
          environments: py314
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
      - name: Cache pinned physics tables
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pyrite/datasets
            ~/.local/share/pyrite/xsgen/tables
            ~/.local/share/pyrite/xsgen/reference-data
          key: pyrite-data-${{ hashFiles('src/pyrite/datasets.py', 'src/pyrite/xsgen/fetch.py', 'src/pyrite/data/xsgen/*-tables.json') }}
      - run: pixi run -e py314 pyrite tables fetch
      - name: Suites with JIT disabled and online checks enabled
        shell: bash
        run: |
          read -ra suites <<< "$SUITES"
          rc=0
          for suite in "${suites[@]}"; do
            echo "::group::$suite"
            export PYRITE_TEST_DIAGNOSTICS="numba-diagnostics/$suite"
            pixi run -e py314 pyrite-dev test-suite "$suite" $SLOW --durations=10 \
              --junitxml="numba-junit-$suite.xml" || rc=1
            echo "::endgroup::"
          done
          exit "$rc"
      - name: Upload test results and worker diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numba-junit-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            numba-junit-*.xml
            numba-diagnostics/
          if-no-files-found: ignore
          retention-days: 30

  # Opt-in Intel SVML Numba environment (#1459, #1462). Anaconda pkgs/main
  # terms apply (LICENSE-SVML.md): this job only checks that the SVML
  # kernels still work and publishes no artifact built from the environment.
  svml:
    runs-on: ubuntu-latest
    env:
      PYRITE_MC_BACKEND: cpu
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.85.0
          environments: svml
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
      - name: Cache pinned physics tables
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pyrite/datasets
            ~/.local/share/pyrite/xsgen/tables
            ~/.local/share/pyrite/xsgen/reference-data
          key: pyrite-data-${{ hashFiles('src/pyrite/datasets.py', 'src/pyrite/xsgen/fetch.py', 'src/pyrite/data/xsgen/*-tables.json') }}
      - run: pixi run -e svml pyrite tables fetch
      - name: Require operational SVML
        run: |
          pixi run -e svml numba -s | tee numba-sysinfo.txt
          grep -E 'SVML Operational +: True' numba-sysinfo.txt
      - name: Node-window and vector-sine kernels under SVML
        run: >
          pixi run -e svml pyrite-dev test
          tests/montecarlo/spectrum/test_node_support_window.py
          tests/montecarlo/spectrum/test_vector_sin.py
          tests/test_jit_cache.py
      - name: Fast math mode under SVML
        env:
          PYRITE_TEST_MATH: fast
          PYRITE_SLOW_TESTS: "1"
        run: >
          pixi run -e svml pyrite-dev test
          tests/montecarlo/runner/test_math_mode_equivalence.py
          tests/test_math_mode.py

  # Fast math mode (#1468): the statistical-equivalence subset with the
  # suite's reproducible pin lifted (PYRITE_TEST_MATH=fast). Tolerances live in
  # tests/montecarlo/runner/test_math_mode_equivalence.py.
  math-fast:
    runs-on: ubuntu-latest
    env:
      PYRITE_MC_BACKEND: cpu
      PYRITE_TEST_MATH: fast
      PYRITE_SLOW_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.85.0
          environments: default
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
      - name: Cache pinned physics tables
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pyrite/datasets
            ~/.local/share/pyrite/xsgen/tables
            ~/.local/share/pyrite/xsgen/reference-data
          key: pyrite-data-${{ hashFiles('src/pyrite/datasets.py', 'src/pyrite/xsgen/fetch.py', 'src/pyrite/data/xsgen/*-tables.json') }}
      - run: pixi run pyrite tables fetch
      - name: Statistical-equivalence subset in fast mode
        run: >
          pixi run pyrite-dev test
          tests/montecarlo/runner/test_math_mode_equivalence.py
          tests/test_math_mode.py
