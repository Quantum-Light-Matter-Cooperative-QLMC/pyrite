name: CI

on:
  pull_request:
    # Stacked issue PRs need the same CI as PRs targeting main.
    branches: [main, "issue-*"]
  push:
    branches: [main]
  schedule:
    # Weekly full CPU test matrix; the CUDA parity run is lab-only.
    - cron: '53 6 * * 0'
  # Bot commits made with GITHUB_TOKEN need an explicit CI dispatch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      quantum: ${{ steps.filter.outputs.quantum || 'false' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            quantum:
              - '.github/workflows/ci.yml'
              - 'src/pyrite/montecarlo/channeling/**'
              - 'src/pyrite/apps/axial_channeling.py'
              - 'src/pyrite/apps/channeling_app.py'
              - 'src/pyrite/materials/channeling/**'
              - 'tests/montecarlo/quantum/**'
              - 'tests/montecarlo/channeling/**'
              - 'tests/materials/test_channeling_*.py'
              - 'tests/notebooks/test_channeling_app.py'
              - 'checks/axial_*.py'
              - 'docs/guides/experimental-*-channeling.md'
              - 'docs/guides/index.md'
              - 'docs/research/physics/axial-*.md'
              - 'docs/validation/channeling/**'
              - 'docs/validation/ledger-channeling.md'

  format:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: format-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # Format the source commit, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"

      - name: Format code
        run: uv run --locked pyrite-dev format

      - name: Regenerate CLI reference
        run: uv run --locked pyrite-dev cli-reference --write

      - name: Commit formatting and generated-reference fixes
        id: commit
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          mapfile -d '' paths < <(
            git diff --name-only -z -- '*.py' '*.pyi' '*.ipynb' \
              'docs/repo-design/cli/cli-reference*.md'
          )
          if [ "${#paths[@]}" -eq 0 ]; then
            exit 0
          fi
          git add -- "${paths[@]}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply Ruff formatting and regenerate CLI reference'
          # A normal push refuses to overwrite a branch updated during this job.
          git push origin "HEAD:refs/heads/$PR_BRANCH"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Run CI on the formatting commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BRANCH: ${{ github.head_ref }}
        run: gh workflow run ci.yml --ref "$PR_BRANCH"

  focused:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        suite:
          - core
          - transport
          - transport-collisions
          - transport-cascades
          - transport-runner
          - spectrum
          - spectrum-coherent
          - spectrum-brem
          - channeling
          - energy-grid
          - materials
          - xsgen
          - cli
          - apps
          - packaging
        python: ["3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --all-groups --locked

      # Every hash-pinned fetched dataset and table release (ADR-0014): EEDL,
      # EADL, EPDL, SBETHE sdbase/ and catalogue tables, ELSEPA, BremsLib, and
      # the positron SBETHE/ELSEPA pins (#263, #282, #284, #385). Positron
      # tests fail rather than skip under CI when those tables are absent. The key follows the pins, so a repin refetches; a
      # cache hit needs no network. `fetch` re-verifies a cached copy and
      # exits 0. PyRITE's own archives are public release assets and can be
      # fetched without a token.
      - name: Cache pinned data
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pyrite/datasets
            ~/.local/share/pyrite/xsgen/tables
            ~/.local/share/pyrite/xsgen/reference-data
          key: pyrite-data-${{ hashFiles('src/pyrite/datasets.py', 'src/pyrite/xsgen/fetch.py', 'src/pyrite/data/xsgen/*-tables.json') }}

      - name: Fetch pinned data
        run: uv run pyrite tables fetch

      - name: Test ${{ matrix.suite }} suite
        # Every PR runs the opt-in slow tier too (#381).
        env:
          PYRITE_SLOW_TESTS: "1"
        run: uv run pyrite-dev test-suite "${{ matrix.suite }}" --durations=30 --durations-min=0.5

  quantum:
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.quantum == 'true'
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Cache pinned data
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pyrite/datasets
            ~/.local/share/pyrite/xsgen/tables
            ~/.local/share/pyrite/xsgen/reference-data
          key: pyrite-data-${{ hashFiles('src/pyrite/datasets.py', 'src/pyrite/xsgen/fetch.py', 'src/pyrite/data/xsgen/*-tables.json') }}

      - name: Fetch pinned data
        run: uv run pyrite tables fetch

      - name: Test quantum suite
        env:
          PYRITE_SLOW_TESTS: "1"
        run: uv run pyrite-dev test-suite quantum --durations=30 --durations-min=0.5

  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
      - run: uv sync --all-groups --locked

      # Includes a non-mutating format check for fork PRs too.
      - name: Verify non-test gates
        run: uv run pyrite-dev verify
      - name: Check agent skills
        run: uv run pyrite-dev check-skills
      - name: Check generated repository map
        run: uv run pyrite-dev repo-map --check

  # Keep the existing JIT-compiled suite above. Here --numba intentionally
  # disables JIT to exercise Python-level Numba bodies; it does NOT test
  # compiled kernels. Online tests run separately on push/main and weekly.
  # Main pushes skip the slow tier (51% of JIT-disabled cost; PRs run it
  # compiled); the weekly run keeps it. Runners act as ~2 cores (4 workers
  # cost 1.6-2.5x per test), so 2 workers per shard; shards balance measured
  # non-slow JIT-disabled cost (#344, lab job 10909, CI run 42924996024).
  numba-online:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: collisions
            suites: transport-collisions
          - shard: transport-spectrum
            suites: >-
              transport transport-runner transport-cascades spectrum
              spectrum-coherent spectrum-brem channeling quantum
          - shard: core-data
            suites: core packaging apps cli energy-grid materials xsgen
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NUMBA_DISABLE_JIT: '1'
      PYRITE_MC_BACKEND: cpu
      PYRITE_ONLINE_TESTS: '1'
      PYRITE_TEST_WORKERS: '2'
      SUITES: ${{ matrix.suites }}
      SLOW: ${{ github.event_name == 'schedule' && '--slow' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.14'
      - run: uv sync --all-groups --locked
      - name: Cache pinned physics tables
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pyrite/datasets
            ~/.local/share/pyrite/xsgen/tables
            ~/.local/share/pyrite/xsgen/reference-data
          key: pyrite-data-${{ hashFiles('src/pyrite/datasets.py', 'src/pyrite/xsgen/fetch.py', 'src/pyrite/data/xsgen/*-tables.json') }}
      - run: uv run pyrite tables fetch
      - name: Suites with JIT disabled and online checks enabled
        shell: bash
        run: |
          read -ra suites <<< "$SUITES"
          rc=0
          for suite in "${suites[@]}"; do
            echo "::group::$suite"
            uv run pyrite-dev test-suite "$suite" $SLOW --durations=10 \
              --junitxml="numba-junit-$suite.xml" || rc=1
            echo "::endgroup::"
          done
          exit "$rc"
      - name: Upload per-test durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numba-junit-${{ matrix.shard }}-${{ github.run_id }}
          path: numba-junit-*.xml
          if-no-files-found: ignore
          retention-days: 30
