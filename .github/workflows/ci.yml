name: CI

on:
  pull_request:
    branches: [main]

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        suite: [core, cli, apps, packaging]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --all-groups --locked

      # EEDL and EADL are hash-pinned fetched datasets, not packaged (ADR-0014,
      # #263). The key follows the pins, so a repin refetches; a cache hit
      # needs no network. `fetch` re-verifies a cached copy and exits 0.
      - name: Cache EPICS2025 datasets
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pyrite/datasets
          key: pyrite-datasets-${{ hashFiles('src/pyrite/datasets.py') }}

      - name: Fetch EPICS2025 datasets
        run: |
          uv run pyrite tables fetch eedl
          uv run pyrite tables fetch eadl

      - name: Test ${{ matrix.suite }} suite
        run: |
          if [ "${{ matrix.suite }}" = core ]; then
            uv run pyrite-dev test-suite core --durations=30 --durations-min=0.5
          else
            uv run pyrite-dev test-suite "${{ matrix.suite }}"
          fi

  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
      - run: uv sync --all-groups --locked

      - name: Verify non-test gates
        run: uv run pyrite-dev verify --skip-tests
