name: Validation evidence (CPU)

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYRITE_MC_BACKEND: cpu
      PYRITE_TEST_WORKERS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.85.0
          environments: py314
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
      - name: Cache pinned physics tables
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pyrite/datasets
            ~/.local/share/pyrite/xsgen/tables
            ~/.local/share/pyrite/xsgen/reference-data
          key: pyrite-data-${{ hashFiles('src/pyrite/datasets.py', 'src/pyrite/xsgen/fetch.py', 'src/pyrite/data/xsgen/*-tables.json') }}
      - run: pixi run -e py314 pyrite tables fetch
      - name: Collect dated CPU validation evidence (no publication)
        run: pixi run -e py314 python checks/refresh_validation_evidence.py --output-dir evidence/validation-344/${{ github.run_id }}
      - name: Upload logs, records and ledger preview even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-cpu-${{ github.run_id }}
          path: evidence/validation-344/
          retention-days: 90
          if-no-files-found: warn
