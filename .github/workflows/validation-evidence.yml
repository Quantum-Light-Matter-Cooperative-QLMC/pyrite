name: Validation evidence (CPU)

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYRITE_MC_BACKEND: cpu
      PYRITE_TEST_WORKERS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pyrite
        with:
          environment: py314
      - uses: ./.github/actions/fetch-tables
        with:
          environment: py314
      - name: Collect dated CPU validation evidence (no publication)
        run: pixi run --locked -e py314 python checks/refresh_validation_evidence.py --output-dir evidence/validation-344/${{ github.run_id }}
      - name: Upload logs, records and ledger preview even on failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: validation-cpu-${{ github.run_id }}
          path: evidence/validation-344/
          retention-days: 90
          if-no-files-found: warn
