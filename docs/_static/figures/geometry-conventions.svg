<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 595"
 role="img" aria-labelledby="title desc">
<title id="title">PyRITE lab and sample frames</title>
<desc id="desc">Left: beam along lab positive z enters a tilted slab at the origin; lab positive x points toward the detector transverse to the beam. The tilt is between lab positive z and the sample normal. The observation angle is between lab positive z and the detector direction. Right: at normal incidence the sample entrance is z equals zero and depth increases along sample positive z toward the rear face. The y axes are omitted.</desc>
<!-- Generated by scripts/docs_figures.py; schematic, not measured or simulated. -->
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4"
 orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#243b53"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172b4d">
<text x="450" y="35" font-size="25" text-anchor="middle">Two frames for the same entrance geometry</text>
<text x="240" y="78" font-size="22" text-anchor="middle">Lab frame: tilt azimuth = 0</text>
<text x="700" y="78" font-size="22" text-anchor="middle">Sample frame: normal incidence</text>
<path d="M520,95 V485" stroke="#9fb3c8" stroke-dasharray="5 5"/>
