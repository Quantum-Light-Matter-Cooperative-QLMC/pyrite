<text x="252" y="461" font-size="18" text-anchor="start">+z lab</text>
<path d="M240,234 L325,381" fill="none" stroke="#243b53" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="322" y="402" font-size="18" text-anchor="start">Sample normal</text>
<path d="M240,234 L380,94" fill="none" stroke="#243b53" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="395" y="110" font-size="18" text-anchor="start">Detector</text>
