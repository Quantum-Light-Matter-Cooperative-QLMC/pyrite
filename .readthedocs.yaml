# Read the Docs configuration: https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    pre_install:
      - python -m pip install uv
    install:
      # Install into Read the Docs' environment for its Sphinx build step.
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --locked --no-default-groups --group docs
    build:
      # The default Sphinx step cannot pass -j; the docs extensions are
      # parallel-safe and a parallel build is several times faster.
      html:
        - $READTHEDOCS_VIRTUALENV_PATH/bin/python -m sphinx -T -W --keep-going -j auto -b html -d docs/_build/doctrees docs $READTHEDOCS_OUTPUT/html

sphinx:
  builder: html
  configuration: docs/conf.py
  fail_on_warning: true
