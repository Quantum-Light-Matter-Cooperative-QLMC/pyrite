# Read the Docs configuration: https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    pre_install:
      - python -m pip install uv
    install:
      # Install into Read the Docs' environment for its Sphinx build step.
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --locked --no-default-groups --group docs

sphinx:
  builder: html
  configuration: docs/conf.py
  fail_on_warning: true
