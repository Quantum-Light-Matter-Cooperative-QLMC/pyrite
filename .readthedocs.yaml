# Read the Docs configuration: https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    pre_install:
      - curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=v0.85.0 PIXI_NO_PATH_UPDATE=1 bash
    install:
      # The locked `docs` pixi environment (#1462), as in the docs workflow.
      - $HOME/.pixi/bin/pixi install --locked -e docs
    build:
      # The default Sphinx step cannot pass -j; the docs extensions are
      # parallel-safe and a parallel build is several times faster.
      html:
        - $HOME/.pixi/bin/pixi run --locked -e docs python -m sphinx -T -W --keep-going -j auto -b html -d docs/_build/doctrees docs $READTHEDOCS_OUTPUT/html

sphinx:
  builder: html
  configuration: docs/conf.py
  fail_on_warning: true
