# `pixi run pre-commit install` installs both stages below. Commit-stage hooks
# fix staged files; pre-push hooks run the cheap CI contracts that `lint`
# alone misses (import-linter layers, the skill mirror, the repo map).
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # Use the same Pixi-locked Ruff as CI and the agent hook. Native notebook
  # linting replaces the separate nbQA environment; the explicit nbqa task stays.
  # Never pass a root --config here: nested Marimo configs disable lint fixes.
  - repo: local
    hooks:
      - id: ruff
        name: Ruff safe fixes and lint checks
        entry: pixi run --locked -e default python -m ruff check --fix --no-unsafe-fixes --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: Ruff format
        entry: pixi run --locked -e default python -m ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]

  # Mirror canonical .agents/skills -> generated .claude/skills, staging the
  # churn so both trees land in the same commit. Runs only when a staged path
  # touches either skill tree.
  - repo: local
    hooks:
      - id: sync-skills
        name: sync .agents/skills -> .claude/skills
        entry: scripts/hooks/sync-skills.sh
        language: system
        files: ^\.(agents|claude)/skills/
        pass_filenames: false

  # Cheap CI gates, run once per push instead of per commit. The full static
  # gate (`pyrite-dev verify`, which adds ty and the docs build) stays manual.
  - repo: local
    hooks:
      - id: import-linter
        name: import-linter layer contracts
        entry: pixi run --quiet --locked -e default imports
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: check-skills
        name: skill mirror is synchronized
        entry: pixi run --quiet --locked -e default check-skills
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: repo-map
        name: generated repository map is current
        entry: pixi run --quiet --locked -e default repo-map-check
        language: system
        pass_filenames: false
        stages: [pre-push]
