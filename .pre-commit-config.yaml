repos:
  # Ruff (lint + format)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.19
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Jupyter notebook linting via nbqa
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1  # pin a stable version
    hooks:
      - id: nbqa-ruff
        args: [--fix, "--extend-ignore=F821"]  # F821 is always a false positive across notebook cells

  # Strip notebook outputs
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  # Mirror canonical .agents/skills -> generated .claude/skills, staging the
  # churn so both trees land in the same commit. Runs only when a staged path
  # touches either skill tree.
  - repo: local
    hooks:
      - id: sync-skills
        name: sync .agents/skills -> .claude/skills
        entry: scripts/hooks/sync-skills.sh
        language: system
        files: ^\.(agents|claude)/skills/
        pass_filenames: false
