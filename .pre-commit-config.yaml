# `uv run pre-commit install` installs both stages below. Commit-stage hooks
# fix staged files; pre-push hooks run the cheap CI contracts that `lint`
# alone misses (import-linter layers, the skill mirror, the repo map).
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # Ruff (lint + format)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.19
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Jupyter notebook linting via nbqa
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1  # pin a stable version
    hooks:
      - id: nbqa-ruff
        args: [--fix, "--extend-ignore=F821"]  # F821 is always a false positive across notebook cells

  # Strip notebook outputs
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  # Mirror canonical .agents/skills -> generated .claude/skills, staging the
  # churn so both trees land in the same commit. Runs only when a staged path
  # touches either skill tree.
  - repo: local
    hooks:
      - id: sync-skills
        name: sync .agents/skills -> .claude/skills
        entry: scripts/hooks/sync-skills.sh
        language: system
        files: ^\.(agents|claude)/skills/
        pass_filenames: false

  # Cheap CI gates, run once per push instead of per commit. The full static
  # gate (`pyrite-dev verify`, which adds ty and the docs build) stays manual.
  - repo: local
    hooks:
      - id: import-linter
        name: import-linter layer contracts
        entry: uv run --quiet lint-imports
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: check-skills
        name: skill mirror is synchronized
        entry: uv run --quiet pyrite-dev check-skills
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: repo-map
        name: generated repository map is current
        entry: uv run --quiet pyrite-dev repo-map --check
        language: system
        pass_filenames: false
        stages: [pre-push]
